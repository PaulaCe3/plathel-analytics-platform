[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bi-multi-industria-backend"
version = "0.1.0"
description = "Backend de ingesta para BI Multi-Industria"
requires-python = ">=3.12"
dependencies = [
  "defusedxml>=0.7.1,<1",
  "fastapi>=0.116,<1",
  "charset-normalizer>=3.4,<4",
  "openpyxl>=3.1,<4",
  "pandas>=2.3,<4",
  "pyarrow>=20,<24",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "import-linter>=2.3,<3",
  "pytest>=8.4,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
