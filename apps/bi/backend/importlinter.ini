[importlinter]
root_packages =
    analytics_core
    bi

[importlinter:contract:core-does-not-import-bi]
name = analytics_core must not import bi
type = forbidden
source_modules =
    analytics_core
forbidden_modules =
    bi

[importlinter:contract:profiles-do-not-import-api]
name = bi.profiles must not import bi.api
type = forbidden
source_modules =
    bi.profiles
forbidden_modules =
    bi.api
