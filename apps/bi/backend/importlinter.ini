[importlinter]
root_packages =
    analytics_core
    bi
    forecast

[importlinter:contract:core-does-not-import-bi]
name = analytics_core must not import bi
type = forbidden
source_modules =
    analytics_core
forbidden_modules =
    bi

[importlinter:contract:profiles-do-not-import-api]
name = bi.profiles must not import bi.api
type = forbidden
source_modules =
    bi.profiles
forbidden_modules =
    bi.api

[importlinter:contract:products-independent]
name = BI and forecast remain independent
type = independence
modules =
    bi
    forecast
[importlinter:contract:core-does-not-import-forecast]
name = analytics_core must not import forecast
type = forbidden
source_modules =
    analytics_core
forbidden_modules =
    forecast
