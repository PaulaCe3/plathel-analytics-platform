name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/bi/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/bi/backend/pyproject.toml
      - name: Install backend dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run backend tests
        run: pytest
      - name: Check dependency boundaries
        run: lint-imports --config importlinter.ini

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/bi/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/bi/frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Lint frontend
        run: pnpm lint
      - name: Build frontend
        run: pnpm build
